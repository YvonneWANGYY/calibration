name: Publish v0.5.1 release
on:
  push:
    tags: [v0.5.1]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish tagged source for archival
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.5.1 >/dev/null 2>&1 ||
            gh release create v0.5.1 --verify-tag --title 'Calibration v0.5.1' \
              --notes 'Includes the measured Sedov and rotating-cylinder cost replay and two matched heat examples illustrating the effect of the cost penalty.'
