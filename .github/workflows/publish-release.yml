name: Publish calibration release
on:
  push:
    tags: ['v[0-9]*']
    branches: [main]
    paths: [.github/workflows/publish-release.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the tagged source and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.5.2' }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then exit 0; fi
          tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq '.message' > "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "Calibration $RELEASE_TAG"
