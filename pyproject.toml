[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fully-autonomous-calibration"
version = "0.4.0"
description = "Lightweight adaptive-calibration recommendation utilities and public examples."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hdf5 = ["h5py"]
flow = ["torch>=2"]
tuning = ["torch>=2", "optuna>=4,<6", "scikit-learn>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
autocalibration = "autocalibration.cli:main"

[tool.setuptools.package-data]
autocalibration = ["starter/*.json", "starter/*.py"]
"autocalibration.paper_sage" = ["*.json", "*/*.json", "*/*.jsonl", "flow/*.py"]
